name: XRPL LAB-004 Live Testnet

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lab004-live-testnet.yml"
      - "labs/004-agentpay-guard/**"

permissions:
  contents: read

jobs:
  live-agentpay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/004-agentpay-guard

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Run policy-gated Testnet payment
        run: npm run live
      - name: Upload sanitized AgentPay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrpl-lab-004-agentpay
          path: labs/004-agentpay-guard/artifacts/*.json
          if-no-files-found: error
          retention-days: 30
