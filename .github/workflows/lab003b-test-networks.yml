name: XRPL LAB-003B Test Network Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lab003b-test-networks.yml"
      - "labs/003-credit-risk-adapter/src/discover-loans.mjs"
      - "evidence/LAB-003B-MAINNET-STATUS.md"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: testnet
            ws: wss://s.altnet.rippletest.net:51233/
          - name: devnet
            ws: wss://s.devnet.rippletest.net:51233/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/003-credit-risk-adapter
    env:
      XRPL_WS: ${{ matrix.ws }}
      XRPL_DISCOVERY_MAX_PAGES: "30"
      XRPL_DISCOVERY_LIMIT: "256"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Probe protocol and discover Loan candidates
        run: node src/discover-loans.mjs
      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrpl-lab-003b-${{ matrix.name }}
          path: labs/003-credit-risk-adapter/artifacts/*.json
          if-no-files-found: error
          retention-days: 30
