name: XRPL LAB-003 Live Testnet

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lab003-live-testnet.yml"
      - "labs/003-credit-risk-adapter/**"

permissions:
  contents: read

jobs:
  live-credit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/003-credit-risk-adapter
    env:
      XRPL_ACCOUNT: rQpW2bpG9mP6UP8WAfJvB2umrra5RjJNs2
      XRPL_TX_LIMIT: "100"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Collect live XRPL credit evidence
        run: npm run collect
      - name: Upload LAB-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrpl-lab-003-evidence
          path: labs/003-credit-risk-adapter/artifacts/*.json
          if-no-files-found: error
          retention-days: 30
