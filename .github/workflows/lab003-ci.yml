name: XRPL LAB-003 CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lab003-ci.yml"
      - ".github/workflows/lab003-live-testnet.yml"
      - "labs/003-credit-risk-adapter/**"
      - "docs/LAB-003-EXPERIMENT-CONTRACT.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/003-credit-risk-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run paper
      - run: node --check src/collect.mjs
      - run: node --check src/features.mjs
